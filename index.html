body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:660px;margin:0 auto;padding:20px 18px 60px}

.keys{display:flex;gap:6px;flex-wrap:wrap}
.key{font-family:var(--head);padding:2px 10px;border:2px dashed var(--line);border-radius:99px;font-weight:700;min-width:80px;text-align:center;color:var(--sub)}
.key.on{border:2px solid var(--or);background:var(--orbg);color:var(--or)}
button,select,input,textarea{font:inherit;color:inherit}

.chk{display:flex;gap:10px;padding:8px 0;cursor:pointer}.chk input{margin-top:6px;width:20px;height:20px;accent-color:var(--or)}
.note{font-size:.88rem;color:var(--sub)}
.chat,.opt{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.ill{display:block;width:100%;max-width:560px;height:auto;margin:0 0 12px;border-radius:16px;border:2px solid var(--line);background:linear-gradient(160deg,var(--orbg),var(--bg))}
.r1{--or:#7a3ff2;--orbg:#f0e9ff}.r2{--or:#0b7f8a;--orbg:#e0f7f8}.r3{--or:#d4600a;--orbg:#fff0e1}.r4{--or:#b0286f;--orbg:#fde8f2}
@media(prefers-color-scheme:dark){.r1{--or:#b794ff;--orbg:#2a1d4d}.r2{--or:#4fd6e0;--orbg:#12383d}.r3{--or:#ffa95c;--orbg:#4a2a12}.r4{--or:#ff8fc4;--orbg:#4a1a33}button:not(.ghost):not(.opt):not(.chat){color:#0e1230}}
.top{flex-wrap:wrap;border-bottom-width:4px;border-image:linear-gradient(90deg,#2f5bea,#7a3ff2,#0b9aa7,#f08a1c) 1}
h2{display:inline-block;border-bottom:4px solid var(--or);padding-bottom:2px}
.hint::before{content:"💡 "}.aviso::before{content:"🫶 "}.ok::before{content:"✅ "}.bad::before{content:"🤔 "}
button{transition:transform .15s,box-shadow .15s}
button:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(20,30,80,.22)}
.chat:hover{transform:none;box-shadow:none;border-color:var(--or)}
.chat.sel{animation:wig .35s}
@keyframes wig{30%{transform:scale(1.02) rotate(-.6deg)}60%{transform:scale(1.02) rotate(.6deg)}}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.25)}100%{transform:scale(1);opacity:1}}
@keyframes bob{50%{transform:translateY(-7px)}}
@keyframes pulse{50%{transform:scale(1.18)}}
@keyframes blink{50%{opacity:.2}}
@keyframes glow{50%{opacity:.3}}
@keyframes fall{to{transform:translateY(112vh) rotate(360deg)}}
main>*:not(.reward){animation:in .45s ease both}
main>*:nth-child(n+3){animation-delay:.08s}main>*:nth-child(n+6){animation-delay:.16s}
.reward{animation:pop .7s cubic-bezier(.2,1.4,.4,1) both}
.key.on{animation:pop .6s both}
.bob{animation:bob 3.5s ease-in-out infinite}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-in-out infinite}
.dot{animation:blink 1.2s infinite}.glow{animation:glow 2.4s ease-in-out infinite}
.cf{position:fixed;top:-40px;pointer-events:none;z-index:9;animation:fall linear forwards}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.top strong{font-family:var(--head)}
dialog{max-width:520px;width:calc(100% - 32px);border:2px solid var(--or);border-radius:12px;background:var(--bg);color:var(--ink);padding:20px}
dialog::backdrop{background:rgba(20,10,40,.6)}

function confetti(n){if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;const E=["✨","🔑","💜","💙","🧡"];for(let i=0;i<n;i++){const e=document.createElement("span");e.className="cf";e.textContent=E[i%E.length];e.style.left=Math.random()*95+"vw";e.style.fontSize=(16+Math.random()*16)+"px";e.style.animationDuration=(2.5+Math.random()*2)+"s";e.style.animationDelay=Math.random()*.8+"s";document.body.appendChild(e);setTimeout(()=>e.remove(),5500)}}
